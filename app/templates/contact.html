{% extends 'base.html' %}
{% block title %}Contact{% endblock %}
{% block content %}
    <h1 class="page-title">contact</h1>


    <div class="contact-layout">
        <div class="contact-side">
            <img class="profile-photo profile-photo-lg" src="{{ url_for('static', filename='img/profile.jpg') }}" alt="Andy Nguyen">
            <ul class="social-list">
                <li>
                    <a class="icon-link linkedin" href="https://www.linkedin.com/in/andy-nguyen-784599265/" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
                        <span>LinkedIn</span>
                    </a>
                </li>
                <li>
                    <a class="icon-link github" href="https://github.com/nguyphu2" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.79-.25.79-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.04-.72.08-.7.08-.7 1.16.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.6.23 2.78.11 3.06.74.8 1.19 1.83 1.19 3.09 0 4.42-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.21.66.8.55A10.51 10.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
                        <span>GitHub</span>
                    </a>
                </li>
                <li>
                    <a class="icon-link email" href="mailto:nguyphu2@oregonstate.edu">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7 10-7"/></svg>
                        <span>Email</span>
                    </a>
                </li>
            </ul>
        </div>

        <form method="POST" action="{{ url_for('public.contact') }}" class="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>
{% endblock %}
